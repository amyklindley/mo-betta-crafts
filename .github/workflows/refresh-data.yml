name: Refresh wiki data

# Scrapes the community wiki's tradeskill pages every night and commits recipes.json when it changed.
# Mo Betta Crafts and the Discord bot pull this file from the repo, so wiki edits reach everyone daily.

on:
  workflow_dispatch:   # manual only: the wiki returns 403 to GitHub-hosted runners, so the nightly run happens from a home PC (nightly-refresh.bat)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape recipes
        run: python wiki_recipes.py
      - name: Commit if changed
        run: |
          git config user.name "wiki-refresh bot"
          git config user.email "actions@users.noreply.github.com"
          git add recipes.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Wiki data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
